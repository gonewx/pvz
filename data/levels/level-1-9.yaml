# Level 1-9: 前院白天 1-9 (Story 8.14)
# 综合挑战关卡 - 第一章最后一个标准关卡
id: "1-9"
name: "前院白天 1-9"
description: "综合测验，检验对第一章所有植物和僵尸的掌握程度"

# === Story 17.2: 顶层字段 ===
flags: 2                        # 2 面旗帜
sceneType: "day"                # 场景类型: 白天前院
rowMax: 5                       # 最大行数: 前院 5 行

# === 开场配置 ===
openingType: "standard"         # 标准开场动画（镜头右移预告僵尸 → 返回草坪）
enabledLanes: [1, 2, 3, 4, 5]   # 完整 5 行草地
availablePlants: ["peashooter", "sunflower", "cherrybomb", "wallnut", "potatomine", "snowpea", "chomper", "repeater"]
skipOpening: false              # 使用标准开场动画
initialSun: 50                  # 初始阳光 50
enableSeedSelection: true       # 启用选卡界面（Story 8.12）

# === 草皮配置 ===
backgroundImage: "IMAGE_BACKGROUND1"
sodRowImage: ""                 # 无草皮叠加
showSoddingAnim: false          # 无铺草皮动画

# === 通关奖励 (Story 8.14) ===
rewardType: "note"              # 奖励类型：僵尸来信
rewardNote: "zombienote1"       # 来信 ID（对应 ZombieNote1.png）

# === 僵尸池 ===
zombiePool: ["basic", "conehead", "buckethead", "polevaulter"]

# === 波次配置 (2 面旗帜，20 波) ===
# 参考 .meta/levels/chapter1.md 第 360-382 行
waves:
  # Wave 1-3: 普通僵尸
  - waveNum: 1
    type: "Fixed"
    isFlag: false
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

