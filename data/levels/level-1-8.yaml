    type: "Fixed"
    isFlag: false
    extraPoints: 5
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 2
        spawnInterval: 2.5
      - type: "polevaulter"
        lanes: [1, 2, 3, 4, 5]
        count: 1
        spawnInterval: 2.5

  # Wave 16: ExtraPoints - 6 点动态分配
  - waveNum: 16
    type: "ExtraPoints"
    isFlag: false
    extraPoints: 6
