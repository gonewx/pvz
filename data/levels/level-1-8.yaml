# Level 1-8: 前院白天 1-8 (Story 8.12)
# 双发射手关卡 - 首次引入铁桶僵尸
id: "1-8"
name: "前院白天 1-8"
description: "引入双发射手的连发攻击和铁桶僵尸的高护甲"

# === Story 17.2: 顶层字段 ===
flags: 1                        # 1 面旗帜
sceneType: "day"                # 场景类型: 白天前院
rowMax: 5                       # 最大行数: 前院 5 行

# === 开场配置 ===
openingType: "standard"         # 标准开场动画（镜头右移预告僵尸 → 返回草坪）
enabledLanes: [1, 2, 3, 4, 5]   # 完整 5 行草地
availablePlants: ["peashooter", "sunflower", "cherrybomb", "wallnut", "potatomine", "snowpea", "chomper"]
skipOpening: false              # 使用标准开场动画
initialSun: 50                  # 初始阳光 50
enableSeedSelection: true       # 启用选卡界面（Story 8.12）

# === 草皮配置 ===
backgroundImage: "IMAGE_BACKGROUND1"
sodRowImage: ""                 # 无草皮叠加
showSoddingAnim: false          # 无铺草皮动画

# === 通关奖励 ===
rewardPlant: "repeater"         # 完成后奖励双发射手

# === 僵尸池 ===
zombiePool: ["basic", "conehead", "buckethead", "polevaulter"]

# === 波次配置 (1 面旗帜，10 波) ===
# 参考 .meta/levels/chapter1.md 第 290-301 行
waves:
  # Wave 1
  - waveNum: 1
    type: "Fixed"
    isFlag: false
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 2
  - waveNum: 2
    type: "Fixed"
    isFlag: false
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 3
  - waveNum: 3
    type: "Fixed"
    isFlag: false
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 4: ExtraPoints - 动态分配
  - waveNum: 4
    type: "ExtraPoints"
    isFlag: false
    extraPoints: 2
    zombies: []

  # Wave 5: ExtraPoints - 2 点动态分配
  - waveNum: 5
    type: "ExtraPoints"
    isFlag: false
    extraPoints: 2
    zombies: []

  # Wave 6: 首次出现铁桶僵尸
  - waveNum: 6
    type: "Fixed"
    isFlag: false
    zombies:
      - type: "buckethead"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 7
  - waveNum: 7
    type: "Fixed"
    isFlag: false
    extraPoints: 2
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 8
  - waveNum: 8
    type: "Fixed"
    isFlag: false
    extraPoints: 2
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 9
  - waveNum: 9
    type: "Fixed"
    isFlag: false
    extraPoints: 2
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 10: Final Wave - basic x 4, flag zombie, Conehead, Buckethead Zombie
  - waveNum: 10
    type: "Final"
    isFlag: true
    flagIndex: 1
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 5
      - type: "conehead"
        lanes: [1, 2, 3, 4, 5]
        count: 1
      - type: "buckethead"
        lanes: [1, 2, 3, 4, 5]
        count: 1
