    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 20: Final Wave - basic x9 + flag + conehead + polevaulter + buckethead + 18 点动态分配
  - waveNum: 20
    type: "Final"
    isFlag: true
    flagIndex: 2
    extraPoints: 18
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 9
        spawnInterval: 1.0
      - type: "flag"
        lanes: [1, 2, 3, 4, 5]
