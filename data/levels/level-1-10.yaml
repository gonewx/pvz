    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 10: 旗帜波 1 - basic x6 + flag + 14 点动态分配
  - waveNum: 10
    type: "Final"
    isFlag: true
    flagIndex: 1
    extraPoints: 14
    zombies:
      - type: "basic"
        lanes: [1, 2, 3, 4, 5]
        count: 6
        spawnInterval: 1.0
      - type: "flag"
        lanes: [1, 2, 3, 4, 5]
        count: 1

  # Wave 11-12: 纯动态分配 12 点
  - waveNum: 11
    type: "ExtraPoints"
