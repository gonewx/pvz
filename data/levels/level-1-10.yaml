  # Wave 16-18: 纯动态分配 18 点
  - waveNum: 16
    type: "ExtraPoints"
    isFlag: false
    extraPoints: 18
    zombies: []

  - waveNum: 17
    type: "ExtraPoints"
    isFlag: false
