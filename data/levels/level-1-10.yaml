    isFlag: false
    extraPoints: 12
    zombies: []

  # Wave 13-15: basic 保底 + 14 点动态分配
  - waveNum: 13
    type: "ExtraPoints"
    isFlag: false
    extraPoints: 14
    zombies:
      - type: "basic"
