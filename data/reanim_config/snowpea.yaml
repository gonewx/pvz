id: snowpea
name: SnowPea
reanim_file: data/reanim/SnowPea.reanim
default_animation: anim_full_idle
scale: 1
images:
    IMAGE_REANIM_PEASHOOTER_BACKLEAF: assets/reanim/PeaShooter_backleaf.png
    IMAGE_REANIM_PEASHOOTER_BACKLEAF_LEFTTIP: assets/reanim/PeaShooter_backleaf_lefttip.png
    IMAGE_REANIM_PEASHOOTER_BACKLEAF_RIGHTTIP: assets/reanim/PeaShooter_backleaf_righttip.png
    IMAGE_REANIM_PEASHOOTER_FRONTLEAF: assets/reanim/PeaShooter_frontleaf.png
    IMAGE_REANIM_PEASHOOTER_FRONTLEAF_LEFTTIP: assets/reanim/PeaShooter_frontleaf_lefttip.png
    IMAGE_REANIM_PEASHOOTER_FRONTLEAF_RIGHTTIP: assets/reanim/PeaShooter_frontleaf_righttip.png
    IMAGE_REANIM_PEASHOOTER_STALK_BOTTOM: assets/reanim/PeaShooter_stalk_bottom.png
    IMAGE_REANIM_PEASHOOTER_STALK_TOP: assets/reanim/PeaShooter_stalk_top.png
    IMAGE_REANIM_SNOWPEA_BLINK1: assets/reanim/SnowPea_blink1.png
    IMAGE_REANIM_SNOWPEA_BLINK2: assets/reanim/SnowPea_blink2.png
    IMAGE_REANIM_SNOWPEA_CRYSTALS1: assets/reanim/SnowPea_crystals1.png
    IMAGE_REANIM_SNOWPEA_CRYSTALS2: assets/reanim/SnowPea_crystals2.png
    IMAGE_REANIM_SNOWPEA_CRYSTALS3: assets/reanim/SnowPea_crystals3.png
    IMAGE_REANIM_SNOWPEA_HEAD: assets/reanim/SnowPea_head.png
    IMAGE_REANIM_SNOWPEA_MOUTH: assets/reanim/SnowPea_mouth.png
available_animations:
    - name: anim_full_idle
      display_name: full_idle
      speed: 1.5
    - name: anim_shooting
      display_name: shooting
      speed: 1.5
    - name: anim_head_idle
      display_name: head_idle
      speed: 1.5
    - name: anim_idle
      display_name: idle
      speed: 1.5
    - name: anim_stem
      display_name: stem
      speed: 1.5
    - name: anim_face
      display_name: face
      speed: 1.5
    - name: anim_blink
      display_name: blink
      speed: 1.5
animation_combos:
    - name: idle
      display_name: 待机
      loop: true
      animations:
        - anim_full_idle
      binding_strategy: auto
      hidden_tracks:
        - anim_blink
        - idle_shoot_blink
    - name: attack_with_sway
      display_name: 攻击+摇晃
      loop: true
      animations:
        - anim_shooting
        - anim_idle
      binding_strategy: auto
      parent_tracks:
        anim_face: anim_stem
        SnowPea_mouth: anim_stem
        SnowPea_crystals1: anim_stem
        SnowPea_crystals2: anim_stem
        SnowPea_crystals3: anim_stem
      hidden_tracks:
        - anim_blink
        - idle_shoot_blink
