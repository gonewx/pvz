# 僵尸生成规则配置

# 红眼数量上限配置
redEyeRules:
  startRound: 5         # 从第 5 轮开始允许红眼
  capacityPerRound: 1   # 每轮增加 1 个红眼上限

# 场景类型限制
sceneTypeRestrictions:
  # 水路专属僵尸（只能在水路行生成）
  waterZombies:
    - snorkel           # 潜水僵尸
    - dolphinrider      # 海豚骑士僵尸
    - ducky             # 鸭子救生圈僵尸

  # 舞王限制
  dancingRestrictions:
    # 舞王禁止出现的场景类型
    prohibitedScenes:
      - roof            # 屋顶场景禁止舞王

    # 舞王需要上下相邻行都是草地（泳池场景限制）
    requiresAdjacentLanes: true

  # 水路场景配置
  waterLaneConfig:
    pool: [3, 4]        # 泳池场景：第 3、4 行为水路
    fog: [3, 4]         # 雾夜场景：第 3、4 行为水路

# Story 17.8: 血量触发加速刷新配置
healthAcceleration:
  minTriggerTimeCs: 401      # 最小刷出时间（厘秒）
  targetCountdownCs: 200     # 触发后倒计时（厘秒）
  thresholdMin: 0.50         # 血量阈值下限
  thresholdMax: 0.65         # 血量阈值上限
